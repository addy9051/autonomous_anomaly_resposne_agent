# ═══════════════════════════════════════════════════════════════
# Render Blueprint for Autonomous SRE SaaS (Connected to Neon Serverless)
# Deploy via Render Dashboard -> Blueprints -> Connect Repo
# ═══════════════════════════════════════════════════════════════

services:
  - type: web
    name: sre-saas-api
    runtime: docker
    dockerfilePath: fully_deployed_saas/Dockerfile
    dockerContext: fully_deployed_saas
    plan: free # or starter ($7/mo)
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Paste your Neon Pooled DATABASE_URL in Render Dashboard
      - key: DATABASE_URL_UNPOOLED
        sync: false # Paste your Neon Unpooled DATABASE_URL in Render Dashboard
      - key: NEON_BRANCH
        value: production
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_API_KEY
        sync: false # Paste your OpenRouter API Key in Render Dashboard
      - key: LLM_MODEL
        value: openrouter/free
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DIMENSIONS
        value: "384"
      - key: ENCRYPTION_MASTER_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: AUTO_REMEDIATION_ENABLED
        value: "false"
