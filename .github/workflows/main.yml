name: Agent System CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff==0.11.13

      - name: Lint (ruff check)
        run: ruff check . --output-format=github

      - name: Format Check (ruff format)
        run: ruff format --check .

  test:
    name: Unit, Integration & Eval Tests
    runs-on: ubuntu-latest
    needs: lint-and-format

    services:
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run Unit Tests
        run: poetry run pytest tests/unit -v --tb=short --junitxml=reports/unit-results.xml

      - name: Run Integration Tests
        run: poetry run pytest tests/integration -v --tb=short --junitxml=reports/integration-results.xml
        continue-on-error: true

      - name: Run Evaluation Suite (Golden Dataset)
        run: poetry run pytest tests/evals -v --tb=short --junitxml=reports/eval-results.xml

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  deploy-to-aws:
    name: Build, Push & Deploy to AWS ECS
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    concurrency:
      group: aws-pilot-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.AWS_ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.AWS_ECS_SERVICE }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push commit and pilot tags
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          test -n "$AWS_REGION"
          test -n "$ECR_REPOSITORY"
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY"
          docker build -f infra/docker/Dockerfile \
            -t "$IMAGE_URI:$GITHUB_SHA" \
            -t "$IMAGE_URI:pilot" \
            .
          docker push "$IMAGE_URI:$GITHUB_SHA"
          docker push "$IMAGE_URI:pilot"

      - name: Deploy to ECS and wait for stability
        run: |
          set -euo pipefail
          test -n "$ECS_CLUSTER"
          test -n "$ECS_SERVICE"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
