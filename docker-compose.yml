# ═══════════════════════════════════════════════════════════════
#  Docker Compose — local development (sandboxed SRE intelligence layer)
#    docker compose up -d      # Postgres (+pgvector), Prometheus, Langfuse
#    docker compose down -v
#  The LLM server is not included: run vLLM/Ollama locally and set LLM_BASE_URL.
#  Local-only credential fallbacks; never reuse them in a deployed environment.
# ═══════════════════════════════════════════════════════════════

services:

  # Episodic memory + RAG knowledge base
  postgres:
    image: pgvector/pgvector:pg16
    container_name: anomaly-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: agent_kb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_not_for_production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./knowledge_base/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: pg_isready -U postgres
      interval: 5s
      timeout: 3s
      retries: 5

  # Local Prometheus, usable as a telemetry source for the connector wizard
  prometheus:
    image: prom/prometheus:latest
    container_name: anomaly-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'

  # Self-hosted LLM tracing (keeps traces in-VPC; do not use hosted LangSmith)
  langfuse-server:
    image: langfuse/langfuse:2
    container_name: anomaly-langfuse
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-dev_only_not_for_production}@langfuse-db:5432/postgres
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-dev_only_change_me}
      - SALT=${LANGFUSE_SALT:-dev_only_change_me}
      - NEXTAUTH_URL=http://localhost:3001
      - TELEMETRY_ENABLED=false

  langfuse-db:
    image: postgres:15
    container_name: anomaly-langfuse-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev_only_not_for_production}
      - POSTGRES_DB=postgres
    volumes:
      - langfuse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  prometheus-data:
  langfuse-data:
